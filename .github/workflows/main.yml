name: Node.js CI
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - run: npm install
    - run: npm run build --if-present

    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:latest .

    - name: Push Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:latest


    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig \
          --name ${{ secrets.EKS_CLUSTER }} \
          --region ${{ secrets.AWS_REGION }}

      # ── Secrets ───────────────────────────────────────────────────────────
    - name: Ensure namespace exists
      run: |
        kubectl create namespace ecommerce --dry-run=client -o yaml | kubectl apply -f -

    - name: Sync Kubernetes Secrets
      run: |
        kubectl create secret generic ecommerce-secrets \
          --namespace=ecommerce \
          --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
          --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
          --from-literal=POSTGRES_DB="${{ secrets.POSTGRES_DB }}" \
          --from-literal=DB_USER="${{ secrets.POSTGRES_USER }}" \
          --from-literal=DB_HOST="postgres" \
          --from-literal=DB_NAME="${{ secrets.POSTGRES_DB }}" \
          --from-literal=DB_PASS="${{ secrets.POSTGRES_PASSWORD }}" \
          --dry-run=client -o yaml | kubectl apply -f -
    

    - name: Apply Kubernetes Manifests
      run: kubectl apply -f backend-K8s/

    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/Deployment \
          --timeout=120s
              
